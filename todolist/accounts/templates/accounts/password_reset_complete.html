{% extends "base_public.html" %}

{% block title %}Mật khẩu đã được đặt lại - Todoist{% endblock %}

{% block content %}
<style>
    .complete-container {
        min-height: 85vh;
        display: flex;
        align-items: center;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        position: relative;
        overflow: hidden;
    }
    
    .complete-container::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -20%;
        width: 500px;
        height: 500px;
        background: linear-gradient(135deg, rgba(195, 57, 43, 0.1) 0%, rgba(139, 40, 32, 0.1) 100%);
        border-radius: 50%;
        filter: blur(60px);
    }
    
    .complete-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .success-icon {
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, #c3392b 0%, #8b2820 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 30px;
        box-shadow: 0 15px 40px rgba(195, 57, 43, 0.3);
        animation: scaleIn 0.5s ease-out 0.3s both, bounce 0.6s ease-out 0.8s;
    }
    
    @keyframes scaleIn {
        from {
            transform: scale(0);
        }
        to {
            transform: scale(1);
        }
    }
    
    @keyframes bounce {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.1);
        }
    }
</style>

<div class="complete-container">
    <div class="container position-relative" style="z-index: 1;">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card complete-card p-5 border-0 text-center" style="border-radius: 24px;">
                    <div class="success-icon">
                        <i class="bi bi-check-circle-fill text-white" style="font-size: 4rem;"></i>
                    </div>
                    <h2 class="fw-bold mb-3" style="color: #333; font-size: 2.2rem;">Thành công!</h2>
                    <p class="text-muted mb-4" style="font-size: 1.1rem; line-height: 1.7;">
                        Mật khẩu của bạn đã được đặt lại thành công. 
                        Bây giờ bạn có thể đăng nhập với mật khẩu mới.
                    </p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-lg px-5 py-3 fw-bold text-white" style="background: linear-gradient(135deg, #c3392b 0%, #8b2820 100%); border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(195, 57, 43, 0.3); transition: all 0.3s;">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập ngay
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
