{% extends 'base_public.html' %}

{% block title %}Đăng nhập - Todoist{% endblock %}

{% block content %}
<style>
    .login-container {
        min-height: 85vh;
        display: flex;
        align-items: center;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        position: relative;
        overflow: hidden;
    }
    
    .login-container::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -20%;
        width: 600px;
        height: 600px;
        background: linear-gradient(135deg, rgba(195, 57, 43, 0.1) 0%, rgba(139, 40, 32, 0.1) 100%);
        border-radius: 50%;
        filter: blur(60px);
    }
    
    .login-container::after {
        content: '';
        position: absolute;
        bottom: -30%;
        left: -10%;
        width: 500px;
        height: 500px;
        background: linear-gradient(135deg, rgba(195, 57, 43, 0.08) 0%, rgba(139, 40, 32, 0.08) 100%);
        border-radius: 50%;
        filter: blur(60px);
    }
    
    .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .login-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #c3392b 0%, #8b2820 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 10px 30px rgba(195, 57, 43, 0.3);
    }
    
    .form-control {
        border: 2px solid #e9ecef;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    
    .form-control:focus {
        border-color: #c3392b;
        box-shadow: 0 0 0 4px rgba(195, 57, 43, 0.1);
        transform: translateY(-2px);
    }
    
    .form-label {
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        font-size: 0.95rem;
    }
    
    .input-group-icon {
        position: relative;
    }
    
    .input-group-icon i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
        z-index: 10;
    }
    
    .input-group-icon input {
        padding-left: 45px;
    }
    
    .btn-login {
        background: linear-gradient(135deg, #c3392b 0%, #8b2820 100%);
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-weight: 700;
        font-size: 1.05rem;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(195, 57, 43, 0.3);
    }
    
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(195, 57, 43, 0.4);
    }
    
    .btn-login:active {
        transform: translateY(0);
    }
    
    .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 1.5rem 0;
        color: #999;
    }
    
    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #e9ecef;
    }
    
    .divider span {
        padding: 0 15px;
        font-size: 0.9rem;
    }
    
    .link-custom {
        color: #c3392b;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    
    .link-custom:hover {
        color: #8b2820;
        text-decoration: underline;
    }
</style>

<div class="login-container">
    <div class="container position-relative" style="z-index: 1;">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card p-5 border-0" style="border-radius: 24px;">
                    <div class="login-header">
                        <div class="login-icon">
                            <i class="bi bi-box-arrow-in-right text-white" style="font-size: 2.5rem;"></i>
                        </div>
                        <h2 class="fw-bold mb-2" style="color: #333; font-size: 2rem;">Chào mừng trở lại</h2>
                        <p class="text-muted mb-0" style="font-size: 0.95rem;">Đăng nhập để tiếp tục công việc của bạn</p>
                    </div>

                    <form method="POST" id="loginForm">
                        {% csrf_token %}
                        
                        {% if next %}
                            <input type="hidden" name="next" value="{{ next }}">
                        {% endif %}
                        
                        <div class="mb-4">
                            <label class="form-label">
                                <i class="bi bi-person me-2"></i>Tên đăng nhập hoặc Email
                            </label>
                            <div class="input-group-icon">
                                <i class="bi bi-person-fill"></i>
                                <input 
                                    type="text" 
                                    name="username" 
                                    class="form-control" 
                                    placeholder="Nhập tên đăng nhập hoặc email" 
                                    required 
                                    autocomplete="username"
                                >
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                <i class="bi bi-lock me-2"></i>Mật khẩu
                            </label>
                            <div class="input-group-icon">
                                <i class="bi bi-lock-fill"></i>
                                <input 
                                    type="password" 
                                    name="password" 
                                    class="form-control" 
                                    placeholder="Nhập mật khẩu" 
                                    required 
                                    autocomplete="current-password"
                                >
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe" name="remember_me">
                                <label class="form-check-label" for="rememberMe" style="font-size: 0.9rem; color: #666;">
                                    Ghi nhớ đăng nhập
                                </label>
                            </div>
                            <a href="{% url 'accounts:password_reset' %}" class="link-custom" style="font-size: 0.9rem;">
                                Quên mật khẩu?
                            </a>
                        </div>

                        <button class="btn btn-login w-100 text-white mb-4" type="submit">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
                        </button>
                    </form>

                    <div class="divider">
                        <span>hoặc</span>
                    </div>

                    <div class="text-center">
                        <p class="mb-0" style="color: #666; font-size: 0.95rem;">
                            Chưa có tài khoản? 
                            <a href="{% url 'accounts:register' %}" class="link-custom">
                                Đăng ký ngay
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Add form validation feedback
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const inputs = this.querySelectorAll('input[required]');
        let isValid = true;
        
        inputs.forEach(input => {
            if (!input.value.trim()) {
                isValid = false;
                input.classList.add('is-invalid');
            } else {
                input.classList.remove('is-invalid');
            }
        });
        
        if (!isValid) {
            e.preventDefault();
        }
    });
</script>
{% endblock %}
