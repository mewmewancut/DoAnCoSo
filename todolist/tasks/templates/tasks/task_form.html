{% extends 'base.html' %}
{% block title %}{% if task %}Edit Task{% else %}Create New Task{% endif %}{% endblock %}

{% block content %}
<style>
    /* 1. Upgrade Card with subtle Glassmorphism style */
    .task-card-premium {
        background: #ffffff;
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(139, 40, 32, 0.08);
        overflow: hidden;
        transition: transform 0.3s ease;
    }

    /* 2. Header with brand gradient */
    .card-header-brand {
        background: linear-gradient(135deg, #c3392b 0%, #8b2820 100%);
        padding: 25px !important;
        border: none;
    }

    /* 3. Form input effects */
    .form-control-custom {
        border: 2px solid #f0f0f0;
        border-radius: 12px;
        padding: 12px 15px;
        transition: all 0.3s ease;
    }
    .form-control-custom:focus {
        border-color: #c3392b;
        box-shadow: 0 0 0 4px rgba(195, 57, 43, 0.1);
        background-color: #fff;
    }

    /* 4. Save button with gradient & shine */
    .btn-save-task {
        background: linear-gradient(135deg, #c3392b 0%, #8b2820 100%);
        border: none;
        border-radius: 12px;
        color: white;
        font-weight: 600;
        letter-spacing: 0.5px;
        padding: 14px;
        transition: all 0.4s ease;
        position: relative;
        overflow: hidden;
    }
    .btn-save-task:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(139, 40, 32, 0.3);
        opacity: 0.95;
    }

    /* 5. Subtle labels */
    .label-premium {
        font-size: 0.9rem;
        color: #555;
        margin-bottom: 8px;
        display: block;
    }

    /* Form load animation */
    .fade-up-form {
        animation: fadeUp 0.6s ease-out;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="row justify-content-center py-5 fade-up-form">
    <div class="col-md-7 col-lg-6">
        <div class="card task-card-premium">
            <div class="card-header card-header-brand">
                <h4 class="mb-0 fw-bold text-white text-center">
                    {% if task %}
                        <i class="fas fa-edit me-2"></i>Edit Task
                    {% else %}
                        <i class="fas fa-plus-circle me-2"></i>Create New Task
                    {% endif %}
                </h4>
            </div>
            
            <div class="card-body p-4 p-lg-5">
                <form method="post" class="needs-validation">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="label-premium fw-bold">
                            Task Title <span class="text-danger">*</span>
                        </label>
                        <input type="text" name="title" class="form-control form-control-custom" 
                               placeholder="Example: Complete quarterly report..." 
                               value="{{ task.title }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="label-premium fw-bold">Detailed Description</label>
                        <textarea name="description" class="form-control form-control-custom" 
                                  rows="4" placeholder="Add notes or details for this task...">{{ task.description }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="label-premium fw-bold">
                            <i class="far fa-calendar-alt me-2 text-brand"></i>Deadline
                        </label>
                        <input type="datetime-local" name="deadline" class="form-control form-control-custom" 
                               value="{{ task.deadline|date:'Y-m-d\TH:i' }}">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="label-premium fw-bold">
                                <i class="fas fa-flag me-2 text-brand"></i>Priority
                            </label>
                            <select name="priority" class="form-select form-control-custom">
                                {% for val, label in priority_choices %}
                                <option value="{{ val }}" {% if task.priority == val %}selected{% elif not task and val == 'medium' %}selected{% endif %}>
                                    {{ label }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-4">
                            <label class="label-premium fw-bold">
                                <i class="fas fa-tasks me-2 text-brand"></i>Status
                            </label>
                            <select name="status" class="form-select form-control-custom">
                                {% for val, label in status_choices %}
                                <option value="{{ val }}" {% if task.status == val %}selected{% elif not task and val == 'pending' %}selected{% endif %}>
                                    {{ label }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mt-4 d-grid gap-3">
                        <button type="submit" class="btn btn-save-task btn-lg">
                            Save Task
                        </button>
                        <a href="{% if task %}{% url 'task_detail' task.id %}{% else %}{% url 'task_list' %}{% endif %}" 
                           class="btn btn-light border-0 py-3 fw-bold text-muted">
                            Cancel and go back
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
