{% extends 'base.html' %}
{% block title %}{% if task %}Sửa Task{% else %}Tạo Task mới{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold text-primary">
                    {% if task %}Cập nhật: {{ task.title }}{% else %}Thêm Task mới{% endif %}
                </h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tiêu đề <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" value="{{ task.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mô tả</label>
                        <textarea name="description" class="form-control" rows="4">{{ task.description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Hạn chót</label>
                        <input type="datetime-local" name="deadline" class="form-control" 
                               value="{{ task.deadline|date:'Y-m-d\TH:i' }}">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Mức độ ưu tiên</label>
                            <select name="priority" class="form-select">
                                {% for val, label in priority_choices %}
                                <option value="{{ val }}" {% if task.priority == val %}selected{% elif not task and val == 'medium' %}selected{% endif %}>
                                    {{ label }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Trạng thái</label>
                            <select name="status" class="form-select">
                                {% for val, label in status_choices %}
                                <option value="{{ val }}" {% if task.status == val %}selected{% elif not task and val == 'pending' %}selected{% endif %}>
                                    {{ label }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mt-4 d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Lưu Task</button>
                        <a href="{% if task %}{% url 'task_detail' task.id %}{% else %}{% url 'task_list' %}{% endif %}" class="btn btn-light border">Hủy bỏ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
