{% extends 'base_private.html' %}
{% block title %}Delete Task{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-danger shadow">
            <div class="card-body text-center p-5">
                <div class="mb-4">
                    <i class="fas fa-exclamation-triangle text-danger fa-4x"></i>
                </div>
                <h3 class="fw-bold">Are you sure?</h3>
                <p class="text-muted">
                    This action cannot be undone. You are about to permanently delete the task:
                </p>
                <div class="alert alert-secondary fw-bold">"{{ task.title }}"</div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger">
                            🗑 Yes, delete it
                        </button>
                        <a href="{% url 'tasks:task_detail' task.id %}" class="btn btn-light border">
                            Go back
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
