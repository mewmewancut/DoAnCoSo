{% extends 'base_public.html' %}
{% load i18n %}

{% block title %}500 — {% trans "Server Error" %}{% endblock %}

{% block content %}
<section class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="text-center px-4">
        <h1 class="display-1 fw-bold text-danger mb-3">500</h1>
        <h2 class="fw-semibold mb-3">{% trans "Server Error" %}</h2>
        <p class="text-muted mb-4" style="max-width: 480px; margin: 0 auto;">
            {% trans "Something went wrong on our end. Please try again later." %}
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="{% url 'home' %}" class="btn btn-danger px-4">
                <i class="bi bi-house-door me-1"></i> {% trans "Home" %}
            </a>
        </div>
    </div>
</section>
{% endblock %}
