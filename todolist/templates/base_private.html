{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}TodoApp{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
     
{% include "partials/styles.html" %}
</head>

<body>
{% include "partials/navbar_private.html" %}
{% include "partials/messages.html" %}
<div class="container-fluid private-layout">
    <div class="row h-100">
        {% include "partials/sidebar.html" %}
                
        <main class="col-md-9 col-lg-10 content-area h-100">
            
           <div id="preview-area" class="mt-4">
            {% block content %}{% endblock %}
           </div>
        </main>
        </div>
</div>
{% include "partials/scripts.html" %}

</body>
</html>

<script>
function toggleDownloadMenu() {
    const menu = document.getElementById("download-submenu");
    menu.classList.toggle("d-none");
}

function loadPreview(type) {
    let url = '';

    if (type === 'week') {
        url = '/tasks/download/week/';
    } else if (type === 'month') {
        url = '/tasks/download/month/';
    }

    fetch(url)
        .then(res => {
            if (!res.ok) throw new Error('404 - Không tìm thấy URL');
            return res.text();
        })
        .then(html => {
            const content = document.getElementById("preview-area");
            content.innerHTML = html;
        })
        .catch(err => console.error(err));
}
</script>



<script>
function toggleTimeView() {
    document.getElementById("time-view")
        .classList.toggle("d-none");
}

function loadTimeView(type) {
    fetch(`/tasks/time-view/${type}/`)
        .then(res => res.text())
        .then(html => {
            document.getElementById("main-content").innerHTML = html;
        });
}
</script>
